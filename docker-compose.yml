version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pminsight-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: pminsight
      MONGO_INITDB_ROOT_PASSWORD: pminsight123
    volumes:
      - mongodb_data:/data/db
    networks:
      - pminsight-network

  redis:
    image: redis:7-alpine
    container_name: pminsight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pminsight-network

  # Uncomment to run backend in Docker
  # api:
  #   build:
  #     context: ./apps/api
  #     dockerfile: Dockerfile
  #   container_name: pminsight-api
