  #   ports:
  #     - "7001:8080"
  #   environment:
  #     - MONGODB_CONNECTION_STRING=mongodb://pminsight:pminsight123@mongodb:27017
  #     - MONGODB_DATABASE_NAME=pminsight
  #     - JWT_SECRET=${JWT_SECRET}
  #     - REDIS_CONNECTION_STRING=redis:6379
  #   depends_on:
  #     - mongodb
  #     - redis
  #   networks:
  #     - pminsight-network

  # Uncomment to run Seq for log viewing
  # seq:
  #   image: datalust/seq:latest
  #   container_name: pminsight-seq
  #   restart: unless-stopped
  #   ports:
  #     - "5341:80"
  #   environment:
  #     - ACCEPT_EULA=Y
  #   volumes:
  #     - seq_data:/data
  #   networks:
